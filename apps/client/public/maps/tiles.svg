<svg xmlns="http://www.w3.org/2000/svg" width="64" height="16" shape-rendering="crispEdges">
  <!-- 家的風格。順序要和 apps/server/src/town/layoutTown.ts 的 TILE 一致 -->
  <!-- 第 1 格：走廊、玄關（米色地毯，細格紋） -->
  <rect x="0" y="0" width="16" height="16" fill="#e8d9b8"/>
  <rect x="0" y="0" width="16" height="1" fill="#efe3c8"/>
  <rect x="0" y="8" width="16" height="1" fill="#dccaa3"/>
  <rect x="0" y="0" width="1" height="16" fill="#dccaa3"/>
  <rect x="8" y="0" width="1" height="16" fill="#efe3c8"/>
  <rect x="4" y="4" width="1" height="1" fill="#d2bd93"/>
  <rect x="12" y="12" width="1" height="1" fill="#d2bd93"/>
  <!-- 第 2 格：牆（暖色壁紙＋木頭踢腳板） -->
  <rect x="16" y="0" width="16" height="16" fill="#c98f6b"/>
  <rect x="16" y="0" width="16" height="2" fill="#b07a58"/>
  <rect x="19" y="2" width="1" height="10" fill="#d4a07e"/>
  <rect x="24" y="2" width="1" height="10" fill="#d4a07e"/>
  <rect x="29" y="2" width="1" height="10" fill="#d4a07e"/>
  <rect x="16" y="12" width="16" height="1" fill="#f0e2cf"/>
  <rect x="16" y="13" width="16" height="3" fill="#7a4e33"/>
  <!-- 第 3 格：語音房＝客廳（溫暖的木地板，錯開的木條） -->
  <rect x="32" y="0" width="16" height="16" fill="#c08a52"/>
  <rect x="32" y="3" width="16" height="1" fill="#a8743f"/>
  <rect x="32" y="7" width="16" height="1" fill="#a8743f"/>
  <rect x="32" y="11" width="16" height="1" fill="#a8743f"/>
  <rect x="32" y="15" width="16" height="1" fill="#a8743f"/>
  <rect x="37" y="0" width="1" height="3" fill="#a8743f"/>
  <rect x="43" y="4" width="1" height="3" fill="#a8743f"/>
  <rect x="35" y="8" width="1" height="3" fill="#a8743f"/>
  <rect x="45" y="12" width="1" height="3" fill="#a8743f"/>
  <rect x="33" y="1" width="2" height="1" fill="#cf9a63"/>
  <rect x="40" y="9" width="2" height="1" fill="#cf9a63"/>
  <!-- 第 4 格：文字房＝書房（淺色磁磚） -->
  <rect x="48" y="0" width="16" height="16" fill="#dfe7ea"/>
  <rect x="48" y="0" width="8" height="8" fill="#eef3f5"/>
  <rect x="56" y="8" width="8" height="8" fill="#eef3f5"/>
  <rect x="48" y="7" width="16" height="1" fill="#c3cfd4"/>
  <rect x="48" y="15" width="16" height="1" fill="#c3cfd4"/>
  <rect x="55" y="0" width="1" height="16" fill="#c3cfd4"/>
  <rect x="63" y="0" width="1" height="16" fill="#c3cfd4"/>
</svg>
